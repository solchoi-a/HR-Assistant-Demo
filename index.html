<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simmons HR Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Simmons HR Assistant — Design Tokens
   Font: Pretendard (로컬 설치 시 우선 적용) → Apple SD Gothic Neo → Noto Sans KR
   TODO: 사내 배포 시 Pretendard woff2 를 자체 호스팅하여 @font-face 로 교체
   ========================================================================= */
:root{
  --navy:#0E1E3C; --navy-2:#1B2F55; --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#EFF4FF;
  --mint:#10B4A0; --mint-l:#E6F7F4; --purple:#7C5CFC; --purple-l:#F1EDFF;
  --amber:#D97706; --amber-l:#FEF4E6; --red:#DC2626; --red-l:#FDECEC; --green:#059669;
  --bg:#FFFFFF; --bg-soft:#F5F7FA; --bg-sunk:#EEF1F6;
  --card:#FFFFFF; --line:#E4E9F0; --line-strong:#CDD5E0;
  --text:#101828; --text-2:#475467; --text-3:#8A94A6;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 4px 16px rgba(16,24,40,.08);
  --sh-3:0 18px 48px rgba(14,30,60,.18);
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --maxw:1240px; --brand-deep:#0E1E3C; --sidebar:#0E1E3C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --bg-soft:#151B23; --bg-sunk:#1B222C; --card:#161D26;
    --line:#252E3A; --line-strong:#33404F;
    --text:#E7ECF3; --text-2:#A7B3C4; --text-3:#7C8899;
    --blue-l:#16233D; --mint-l:#0F2A28; --purple-l:#201B3A; --amber-l:#2C2213; --red-l:#2E1919;
    --navy:#E7ECF3; --navy-2:#C7D2E0;
    --sh-2:0 4px 16px rgba(0,0,0,.4); --sh-3:0 18px 48px rgba(0,0,0,.55);
    --brand-deep:#10202F; --sidebar:#0B1017;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --bg-soft:#151B23; --bg-sunk:#1B222C; --card:#161D26;
  --line:#252E3A; --line-strong:#33404F;
  --text:#E7ECF3; --text-2:#A7B3C4; --text-3:#7C8899;
  --blue-l:#16233D; --mint-l:#0F2A28; --purple-l:#201B3A; --amber-l:#2C2213; --red-l:#2E1919;
  --navy:#E7ECF3; --navy-2:#C7D2E0; --brand-deep:#10202F; --sidebar:#0B1017;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:anywhere;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 공통 요소 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;
  font-size:14px;font-weight:600;border:1px solid var(--line-strong);background:var(--card);color:var(--text);transition:.15s}
.btn:hover{background:var(--bg-soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--bg-sunk)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.danger{color:var(--red);border-color:var(--line-strong)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;
  background:var(--bg-soft);border:1px solid var(--line);color:var(--text-2);transition:.15s}
button.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;line-height:1.7}
.tag.blue{background:var(--blue-l);color:var(--blue)} .tag.mint{background:var(--mint-l);color:var(--mint)}
.tag.purple{background:var(--purple-l);color:var(--purple)} .tag.gray{background:var(--bg-sunk);color:var(--text-2)}
.tag.amber{background:var(--amber-l);color:var(--amber)} .tag.red{background:var(--red-l);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.muted{color:var(--text-2)} .dim{color:var(--text-3)} .small{font-size:13px}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--card)}
.textarea{min-height:92px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- 포털(데모 배경) ---------- */
.portal-top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.portal-top .inner{max-width:var(--maxw);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;color:var(--navy);font-size:16px}
.brandmark .sq{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand-deep),var(--blue));
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.portal-top .grow{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px}
.portal{max-width:var(--maxw);margin:0 auto;padding:28px 20px 140px}
.portal h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.03em;margin:.2em 0 .1em;color:var(--navy)}
.portal .lead{color:var(--text-2);max-width:62ch;margin:0 0 26px}
.notice-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.notice{padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.notice b{display:block;font-size:14.5px;margin-bottom:4px;color:var(--text)}
.notice span{font-size:12.5px;color:var(--text-3)}
.hint-strip{margin:26px 0 0;padding:16px 18px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--blue-l),var(--mint-l));
  border:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hint-strip b{color:var(--navy)}

/* ---------- Floating Chat ---------- */
.fab{position:fixed;right:22px;bottom:22px;z-index:60;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(140deg,var(--brand-deep),var(--blue));color:#fff;box-shadow:var(--sh-3);
  display:grid;place-items:center;font-size:23px;transition:transform .18s}
.fab:hover{transform:translateY(-2px) scale(1.04)}
.fab .dot{position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;background:var(--mint);border:2px solid var(--card)}
.chatwrap{position:fixed;right:22px;bottom:92px;z-index:61;width:396px;max-width:calc(100vw - 32px);
  height:min(660px,calc(100vh - 128px));background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-3);display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:13px 14px;background:linear-gradient(120deg,var(--brand-deep),#2A4479);color:#fff}
.chat-head .bot{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px}
.chat-head b{font-size:14.5px;display:block;line-height:1.3}
.chat-head small{font-size:11.5px;opacity:.72}
.chat-head .x{margin-left:auto;color:#fff;opacity:.8;font-size:18px;width:30px;height:30px;border-radius:8px}
.chat-head .x:hover{background:rgba(255,255,255,.14);opacity:1}
.chat-body{flex:1;overflow-y:auto;padding:16px 14px 6px;background:var(--bg-soft);scroll-behavior:smooth}
.chat-foot{border-top:1px solid var(--line);padding:10px 12px;background:var(--card)}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--bg-soft);border:1px solid var(--line-strong);border-radius:16px;padding:6px 6px 6px 14px}
.composer:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.composer textarea{flex:1;border:none;background:none;resize:none;max-height:110px;padding:7px 0;outline:none;font-size:14px;line-height:1.5}
.send{width:34px;height:34px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--line-strong);cursor:not-allowed}
.chat-foot .legal{font-size:11px;color:var(--text-3);text-align:center;margin:7px 2px 0}

.welcome{padding:6px 2px 10px}
.welcome h3{margin:0 0 4px;font-size:17px;letter-spacing:-.02em;color:var(--navy)}
.welcome p{margin:0 0 18px;font-size:13.5px;color:var(--text-2)}
.sect-label{font-size:12px;font-weight:700;color:var(--text-3);margin:0 0 9px}
.sugg{display:flex;flex-direction:column;gap:7px}
.sugg button{text-align:left;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:13.5px;color:var(--text);transition:.15s;display:flex;gap:8px;align-items:flex-start}
.sugg button:hover{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.sugg button i{font-style:normal;opacity:.6}

.msg{margin-bottom:16px;display:flex;gap:9px}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:86%;font-size:14px}
.msg .ava{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--brand-deep),var(--blue));color:#fff;
  display:grid;place-items:center;font-size:14px;flex:none}
.ans{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:13px 15px;max-width:calc(100% - 38px);box-shadow:var(--sh-1)}
.ans .body{font-size:14px;white-space:pre-wrap}
.ans .body b{color:var(--navy)}
.ans .body .kv{display:block;padding-left:10px;border-left:2px solid var(--line);margin:3px 0;color:var(--text-2);font-size:13.5px}
.block{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
.block > .t{font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.srcbox{background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.srcbox .name{font-size:13.5px;font-weight:700;color:var(--navy);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.srcbox .meta{font-size:12px;color:var(--text-3);margin-top:3px}
.srcbox a{font-size:12.5px;font-weight:600;display:inline-block;margin-top:6px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw button{padding:5px 11px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--text-2)}
.kw button:hover{border-color:var(--mint);color:var(--mint);background:var(--mint-l)}
.relq{display:flex;flex-direction:column;gap:6px}
.relq button{text-align:left;font-size:13px;color:var(--blue);padding:7px 10px;border-radius:9px;background:var(--blue-l)}
.relq button:hover{background:var(--card);outline:1px solid var(--blue)}
.fb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3)}
.fb button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--card)}
.fb button:hover{border-color:var(--blue-d)}
.fb button.on{background:var(--mint-l);border-color:var(--mint);color:var(--mint);font-weight:600}
.fb button.on.bad{background:var(--red-l);border-color:var(--red);color:var(--red)}
.fbform{margin-top:10px;background:var(--bg-soft);border-radius:12px;padding:11px}
.fbform label{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 2px;cursor:pointer}
.nogo{background:var(--amber-l);border:1px solid rgba(217,119,6,.28)}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);display:block;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(14,30,60,.42);display:grid;place-items:center;padding:18px}
.modal .sheet{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh-3);width:min(520px,100%);max-height:88vh;overflow-y:auto}
.modal .sheet.wide{width:min(780px,100%)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.sheet-head h3{margin:0;font-size:17.5px;letter-spacing:-.02em;color:var(--navy)}
.sheet-body{padding:12px 22px 20px}
.sheet-foot{padding:0 22px 20px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.convo-peek{background:var(--bg-soft);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--text-2);max-height:150px;overflow:auto}
.convo-peek div{margin-bottom:5px}

/* ---------- 로그인 ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(900px 480px at 12% -8%,var(--blue-l),transparent 60%),
  radial-gradient(760px 420px at 96% 8%,var(--mint-l),transparent 62%),var(--bg)}
.login .box{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-2);padding:30px 28px}
.login h2{margin:16px 0 4px;font-size:21px;letter-spacing:-.03em;color:var(--navy)}
.login p{margin:0 0 22px;font-size:13.5px;color:var(--text-2)}
.acct{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:9px;background:var(--card);transition:.15s}
.acct:hover{border-color:var(--blue);background:var(--blue-l)}
.acct .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none}
.acct b{display:block;font-size:14px} .acct span{font-size:12.5px;color:var(--text-3)}

/* ---------- Admin ---------- */
.admin{display:flex;min-height:100vh;background:var(--bg-soft)}
.side{width:246px;flex:none;background:var(--sidebar);color:#C9D5E8;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:9px;padding:6px 10px 18px;color:#fff;font-weight:700;letter-spacing:-.02em}
.side .logo .sq{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--mint));display:grid;place-items:center;font-size:13px}
.side .grp{margin:14px 0 6px;padding:0 12px;font-size:11px;font-weight:700;color:#7C8DA8}
.side a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;color:#C9D5E8;font-size:13.5px;font-weight:500}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{background:linear-gradient(120deg,var(--blue),#3B6FF0);color:#fff;font-weight:600}
.side a .b{margin-left:auto;background:rgba(255,255,255,.16);border-radius:999px;padding:1px 7px;font-size:11px}
.side a.on .b{background:rgba(255,255,255,.26)}
.side .sub a{padding-left:32px;font-size:13px}
.side .foot{margin-top:18px;padding:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8A9BB5}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:13px 22px;display:flex;align-items:center;gap:12px}
.topbar h2{margin:0;font-size:17px;letter-spacing:-.02em;color:var(--navy)}
.topbar .grow{flex:1}
.burger{display:none}
.content{padding:22px;max-width:1280px;width:100%}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 17px}
.kpi .l{font-size:12.5px;color:var(--text-3);font-weight:600}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.04em;color:var(--navy);margin:6px 0 2px;line-height:1.1}
.kpi .d{font-size:12px;color:var(--text-3)}
.kpi .d.up{color:var(--green)} .kpi .d.down{color:var(--red)}
.grid2{display:grid;gap:14px;grid-template-columns:1.25fr .95fr;align-items:start}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.panel > h3{margin:0;padding:15px 18px 0;font-size:15px;letter-spacing:-.02em;color:var(--navy);display:flex;align-items:center;gap:8px}
.panel > h3 .r{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--text-3)}
.panel .pad{padding:14px 18px 18px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
thead th{text-align:left;font-size:12px;color:var(--text-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg-soft)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-soft)}
td .ttl{font-weight:600;color:var(--text)}
.rankrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.rankrow:last-child{border-bottom:none}
.rankrow .n{width:21px;height:21px;border-radius:7px;background:var(--bg-sunk);color:var(--text-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.rankrow:nth-child(-n+3) .n{background:var(--blue);color:#fff}
.rankrow .q{flex:1;font-size:13.5px;min-width:0}
.rankrow .c{font-size:12.5px;color:var(--text-3);font-weight:600;white-space:nowrap}
.bar{height:6px;border-radius:999px;background:var(--bg-sunk);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--mint))}
.gap{border:1px solid rgba(217,119,6,.3);background:var(--amber-l);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.gap .q{font-weight:700;color:var(--navy);font-size:14px}
.gap .s{font-size:12.5px;color:var(--text-2);margin:5px 0 9px}
.gap .s b{color:var(--amber)}
.empty{padding:34px 18px;text-align:center;color:var(--text-3);font-size:13.5px}
.empty b{display:block;color:var(--text-2);margin-bottom:4px;font-size:14.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
.tabs button{padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

const QMUL = 2.7;

function buildSeed() {
  const questions = [], feedback = [], inquiries = [];
  let n = 0;
  SEED_Q.forEach(([q, cat, kid, cnt, pos, neg]) => {
    const total = Math.round(cnt * QMUL);
    for (let i = 0; i < total; i++) {
      const d = daysAgo(Math.floor(Math.random() * 30));
      const id = 'Q-S' + (++n);
      questions.push({ id, text: q, category: cat, answered: true, knowledgeId: kid, status: 'answered',
        userId: 'U-' + (100 + (n % 180)), createdAt: iso(d), seeded: true });
      const r = Math.random();
      if (r < pos) feedback.push({ id: uid('F'), questionId: id, questionText: q, type: 'up', reason: null, createdAt: iso(d), seeded: true });
      else if (r < pos + neg + .06) feedback.push({ id: uid('F'), questionId: id, questionText: q, type: 'down',
        reason: ['규정과 다른 것 같아요','최신 기준이 아닌 것 같아요','질문 의도와 다른 답변이에요','내용이 부족해요'][Math.floor(Math.random() * 4)],
        createdAt: iso(d), seeded: true });
    }
  });
  SEED_GAP.forEach(([q, cat, cnt]) => {
    for (let i = 0; i < cnt; i++) {
      const d = daysAgo(Math.floor(Math.random() * 30));
      questions.push({ id: 'Q-G' + (++n), text: q, category: cat, answered: false, knowledgeId: null,
        status: 'unanswered', userId: 'U-' + (100 + (n % 180)), createdAt: iso(d), seeded: true });
    }
  });
  for (let r = 0; r < 5; r++) SEED_INQ.forEach(([type, body], i) => {
    const ago = (r * 6 + i) % 29;
    inquiries.push({
      id: 'HR-S' + (r * 8 + i + 1), type, body, userId: 'U-' + (120 + r * 8 + i), userName: '임직원',
      includeConvo: i % 2 === 0, convo: i % 2 === 0 ? [{ role: 'user', text: body }] : [],
      status: ago > 7 ? 'done' : 'open', createdAt: iso(daysAgo(ago)), seeded: true
    });
  });
  inquiries.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  return { questions, feedback, inquiries };
}

const Store = {
  s: null,
  init() {
    let saved = null;
    try { const raw = localStorage.getItem(LS_KEY); if (raw) saved = JSON.parse(raw); } catch (e) { saved = null; }
    if (saved && saved.v === 1 && Array.isArray(saved.knowledge)) { this.s = saved; }
    else {
      const seed = buildSeed();
      this.s = { v: 1, knowledge: KB_SEED.map(k => ({ ...k })), questions: seed.questions, feedback: seed.feedback,
        inquiries: seed.inquiries, conversations: [], baseUsers: 682, role: null, userName: null };
      this.save();
    }
    if (!this.s.conversations) this.s.conversations = [];
  },
  save() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.s, (k, v) => k.startsWith('__') ? undefined : v)); } catch (e) { /* 저장 불가 환경에서도 세션은 동작 */ } },
  reset() { try { localStorage.removeItem(LS_KEY); } catch (e) {} this.s = null; this.init(); },

  /* ---- 조회/집계 API (서버 전환 시 이 함수들만 교체) ---- */
  kb() { return this.s.knowledge; },
  activeKb() { return this.s.knowledge.filter(k => docStatus(k) === 'current'); },
  addQuestion(q) { this.s.questions.push(q); this.save(); return q; },
  addFeedback(f) { this.s.feedback.push(f); this.save(); return f; },
  addInquiry(i) { this.s.inquiries.unshift(i); this.save(); return i; },
  stats() {
    const qs = this.s.questions, fb = this.s.feedback;
    const answered = qs.filter(q => q.answered).length;
    const up = fb.filter(f => f.type === 'up').length, down = fb.filter(f => f.type === 'down').length;
    const transferred = this.s.inquiries.length;
    const users = this.s.baseUsers + new Set(qs.filter(q => !q.seeded).map(q => q.userId)).size;
    return {
      users, total: qs.length, answered, unanswered: qs.length - answered,
      answerRate: qs.length ? (answered / qs.length * 100) : 0,
      transferRate: qs.length ? (transferred / qs.length * 100) : 0,
      posRate: (up + down) ? (up / (up + down) * 100) : 0,
      up, down, transferred,
      openInquiries: this.s.inquiries.filter(i => i.status === 'open').length
    };
  },
  topQuestions(n = 10) {
    const m = new Map();
    this.s.questions.forEach(q => {
      const k = q.text.trim();
      const e = m.get(k) || { text: k, count: 0, category: q.category, answered: 0 };
      e.count++; if (q.answered) e.answered++; m.set(k, e);
    });
    return [...m.values()].sort((a, b) => b.count - a.count).slice(0, n);
  },
  byCategory() {
    const m = new Map(CATEGORIES.map(c => [c, 0]));
    this.s.questions.forEach(q => m.set(q.category || '기타', (m.get(q.category || '기타') || 0) + 1));
    return [...m.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  },
  trend(days = 14) {
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = iso(daysAgo(i));
      out.push({ d, n: this.s.questions.filter(q => q.createdAt === d).length });
    }
    return out;
  },
  unansweredGroups() {
    const m = new Map();
    this.s.questions.filter(q => !q.answered).forEach(q => {
      const e = m.get(q.text) || { text: q.text, category: q.category, count: 0, last: q.createdAt };
      e.count++; if (q.createdAt > e.last) e.last = q.createdAt; m.set(q.text, e);
    });
    return [...m.values()].sort((a, b) => b.count - a.count);
  },
  knowledgeGaps() {
    const gaps = new Map();
    this.unansweredGroups().forEach(g => {
      const topic = gapTopic(g.text, g.category);
      const e = gaps.get(topic) || { topic, category: g.category, asked: 0, unanswered: 0, negative: 0, samples: [] };
      e.asked += g.count; e.unanswered += g.count;
      if (e.samples.length < 3) e.samples.push(g.text);
      gaps.set(topic, e);
    });
    this.s.feedback.filter(f => f.type === 'down').forEach(f => {
      const q = this.s.questions.find(q => q.id === f.questionId);
      const topic = gapTopic(f.questionText || '', q ? q.category : '기타');
      const e = gaps.get(topic) || { topic, category: q ? q.category : '기타', asked: 0, unanswered: 0, negative: 0, samples: [] };
      e.asked += 1; e.negative += 1;
      if (e.samples.length < 3 && f.questionText) e.samples.push(f.questionText);
      gaps.set(topic, e);
    });
    return [...gaps.values()].filter(g => g.unanswered + g.negative >= 3)
      .sort((a, b) => (b.unanswered * 2 + b.negative) - (a.unanswered * 2 + a.negative));
  }
};

/* 질문 문장에서 Knowledge Gap 주제를 뽑아낸다 (간이 토픽 라벨러) */
const GAP_RULES = [
  [['휴직','평가'], '휴직자 평가 기준'], [['휴직','승진'], '휴직 기간과 승진'],
  [['대체인력'], '대체인력 운영'], [['복직','연차'], '복직자 연차 산정'],
  [['성과급'], '성과급 지급 기준'], [['승진'], '승진 기준'],
  [['퇴직금'], '퇴직금 지급'], [['평가'], '평가 운영'], [['연차'], '연차 운영'],
];
function gapTopic(text, cat) {
  const t = (text || '').replace(/\s/g, '');
  for (const [keys, label] of GAP_RULES) if (keys.every(k => t.includes(k))) return label;
  return (cat || '기타') + ' 일반';
}

function docStatus(k) {
  const today = iso(TODAY);
  if (!k.is_active) return 'expired';
  if (k.expiry_date && k.expiry_date < today) return 'expired';
  if (k.effective_date > today) return 'upcoming';
  return 'current';
}

/* 의미는 있으나 어느 문서에나 등장하는 일반어 — 근거 커버리지 판정에서 제외 */
const GENERIC = new Set(['지원','사내','신청','제도','등록','사용','회사','임직원','구성원','직원','운영','가능','내용','대상',
  '기준','방법','절차','어떻게','며칠','몇일','어떤','어느','무슨','얼마','정도','혹시','그럼','우리','저희','현재','관련','문의','확인','궁금',
  '어디','언제','누가','누구','무엇','뭐지','알고','알려','싶은','싶습니다','해도','그리고','또는','보통','만약']);
const VERB = /(할수있|할수|하는데|하는|하면|해요|합니다|하고|한다|하나|할|한|함|되나|되는|된다|된|됩니다|드려요|주세요|이나|인지|이면|라면|으면|했는데|했|였|아요|어요|여요|는데|고요|되)$/;
/* 질문에서 '실제 내용어'만 추출 (근거 커버리지 판정용) */
function contentTokens(q) {
  const out = new Set();
  normalize(q).split(' ').forEach(w => {
    let t = w.replace(JOSA, '').replace(VERB, '').replace(JOSA, '');
    if (t.length >= 2 && !STOP.has(t) && !GENERIC.has(t)) out.add(t);
  });
  return [...out];
}
function allText(k) { const ix = indexed(k); return ix.__all || (ix.__all = (ix.title + ' ' + ix.kw + ' ' + ix.faq + ' ' + ix.body).replace(/\s/g, '')); }
/* 토큰 자체 / 접두어 / 동의어 중 하나라도 Knowledge에 있으면 '근거 있음'으로 본다 */
function covCandidates(tok) {
  const cand = [tok];
  for (let n = tok.length - 1; n >= 2; n--) cand.push(tok.slice(0, n));
  Object.keys(SYN).forEach(k => { if (tok.includes(k)) SYN[k].forEach(v => cand.push(v)); });
  return cand;
}
function coveredAnywhere(tok) {
  const cand = covCandidates(tok);
  if (cand.some(c => GENERIC.has(c))) return true;
  return Store.kb().some(k => cand.some(c => allText(k).includes(c)));
}
function coveredByDocs(docs, tok) {
  const cand = covCandidates(tok);
  if (cand.some(c => GENERIC.has(c))) return true;
  return docs.some(k => cand.some(c => allText(k).includes(c)));
}
function coveredStrong(k, tok) { const ix = indexed(k); return (ix.title + ' ' + ix.kw + ' ' + ix.faq).replace(/\s/g, '').includes(tok); }

function normalize(s) { return (s || '').toLowerCase().replace(/[^\uAC00-\uD7A3a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
/* 질문 토큰 + 가중치. 원형 토큰 1.0, 접두어 0.5~0.6, 동의어 확장 0.45 */
function weightedTokens(q) {
  const map = new Map();
  const put = (t, w) => { if (t && t.length >= 2 && !STOP.has(t)) map.set(t, Math.max(map.get(t) || 0, w)); };
  normalize(q).split(' ').forEach(w0 => {
    if (!w0) return;
    const st = w0.replace(JOSA, '').replace(VERB, '').replace(JOSA, '');
    put(w0, 1); put(st, 1);
    const base = st.length >= 4 ? st : w0;
    if (base.length >= 4) { put(base.slice(0, 3), 0.6); put(base.slice(0, 2), 0.5); }
  });
  [...map.keys()].forEach(t => { Object.keys(SYN).forEach(k => { if (t.includes(k)) SYN[k].forEach(v => put(v, 0.45)); }); });
  return [...map.entries()].map(([t, w]) => ({ t, w }));
}
function tokenize(q) { return weightedTokens(q).map(x => x.t); }
function bigrams(s) {
  const t = normalize(s).replace(/\s/g, ''); const set = new Set();
  for (let i = 0; i < t.length - 1; i++) set.add(t.slice(i, i + 2));
  return set;
}

function indexed(k) {
  if (k.__idx) return k.__idx;
  const title = normalize(k.title), kw = normalize((k.keywords || []).join(' ')),
        faq = normalize((k.faqs || []).join(' ')), body = normalize(k.content);
  k.__idx = { title, kw, faq, body, bg: bigrams(k.title + ' ' + (k.keywords || []).join(' ') + ' ' + (k.faqs || []).join(' ')) };
  return k.__idx;
}

function retrieve(query, opts) {
  opts = opts || {};
  const wt = weightedTokens(query), qbg = bigrams(query);
  const results = [];
  Store.kb().forEach(k => {
    if (opts.activeOnly && docStatus(k) !== 'current') return;
    const ix = indexed(k);
    let score = 0, strong = 0;
    wt.forEach(({ t, w }) => {
      let hit = false;
      if (ix.title.includes(t)) { score += 7 * w; hit = true; }
      if (ix.kw.includes(t)) { score += 6 * w; hit = true; }
      if (ix.faq.includes(t)) { score += 4 * w; hit = true; }
      if (ix.body.includes(t)) score += 1.6 * w;
      if (hit && w >= 0.9) strong++;
    });
    let inter = 0; qbg.forEach(b => { if (ix.bg.has(b)) inter++; });
    score += (inter / Math.max(5, qbg.size)) * 9;
    const st = docStatus(k);
    if (st === 'current') score *= 1.25; else if (st === 'upcoming') score *= 0.85; else score *= 0.4;
    if (k.is_demo) score *= 0.9;
    if (score > 0) results.push({ k, score, strong, status: st });
  });
  return results.sort((a, b) => b.score - a.score).slice(0, 8);
}

/* 본문에서 질문과 가장 관련 있는 구간만 추출 */
function extractSections(k, toks) {
  const raw = k.content.trim();
  const lines = raw.split('\n');
  const secs = []; let cur = { head: '', lines: [] };
  lines.forEach(ln => {
    if (/^[\[■●]/.test(ln.trim()) && cur.lines.length) { secs.push(cur); cur = { head: ln, lines: [ln] }; }
    else cur.lines.push(ln);
  });
  secs.push(cur);
  if (raw.length <= 620 || secs.length <= 1) return raw;
  const scored = secs.map(s => {
    const t = normalize(s.lines.join(' ')).replace(/\s/g, '');
    let sc = 0; toks.forEach(k2 => { if (t.includes(k2)) sc += 1; });
    return { s, sc };
  });
  const max = Math.max(...scored.map(x => x.sc));
  if (max === 0) return secs.slice(0, 2).map(s => s.lines.join('\n')).join('\n\n').trim();
  const keep = scored.filter(x => x.sc >= Math.max(1, max - 1)).slice(0, 3);
  return keep.map(x => x.s.lines.join('\n').trim()).join('\n\n').trim();
}

/* 가장 답에 가까운 한 문장 */
function leadSentence(k, toks) {
  const cands = k.content.split('\n').map(s => s.trim())
    .filter(s => s.length > 12 && !/^[\[■●※]/.test(s) && !/^\d+\.\s*$/.test(s));
  let best = null, bs = -1;
  cands.forEach(s => {
    const t = normalize(s).replace(/\s/g, ''); let sc = 0;
    toks.forEach(x => { if (t.includes(x)) sc += 1; });
    if (sc > bs) { bs = sc; best = s; }
  });
  return bs > 0 ? best : null;
}

const NO_ANSWER = `현재 등록된 HR 공식 자료에서는 정확한 답변을 확인하기 어렵습니다.
개인의 상황에 따라 달라질 수 있는 내용이므로 HR 담당자에게 문의해 주세요.`;

const AI = {
  /* 질문 1건 처리 → 답변 객체 반환 */
  ask(query) {
    const toks = tokenize(query);
    const cts = contentTokens(query);
    const hits = retrieve(query);
    const top = hits[0];

    /* (1) 질문의 내용어가 Knowledge Base 어디에도 없으면 답변을 생성하지 않는다 */
    const uncoveredAll = cts.filter(t => !coveredAnywhere(t));
    const coverage = cts.length ? (cts.length - uncoveredAll.length) / cts.length : 1;
    if (!top || top.score < 13 || top.strong === 0 || (cts.length > 0 && coverage < 0.4)) {
      return { ok: false, text: NO_ANSWER, sources: [], keywords: suggestKeywords(toks, []), related: [],
        confidence: 'none', missing: uncoveredAll };
    }

    /* (2) 상위 문서 선택 + 빠진 주제를 보완하는 문서 추가 (복합 질문 대응) */
    const used = [top];
    const second = hits[1];
    if (second && second.score >= top.score * 0.55 && second.strong > 0 && second.k.category !== top.k.category) used.push(second);
    cts.forEach(t => {
      if (used.length >= 3) return;
      if (coveredByDocs(used.map(u => u.k), t)) return;
      let extra = hits.find(h => !used.includes(h) && coveredStrong(h.k, t));
      if (!extra) {
        const k2 = Store.kb().filter(k => docStatus(k) !== 'expired').find(k => coveredStrong(k, t));
        if (k2) extra = { k: k2, score: 0, strong: 1, status: docStatus(k2) };
      }
      if (extra) used.push(extra);
    });

    /* (3) 본문 발췌 */
    let body = extractSections(top.k, toks);
    const lead = leadSentence(top.k, toks);
    let text = '';
    if (lead && !body.includes(lead)) text += lead + '\n\n';
    text += body;
    used.slice(1).forEach(u => {
      text += '\n\n함께 적용되는 기준 — ' + u.k.title + '\n' + extractSections(u.k, toks).split('\n').slice(0, 7).join('\n');
    });

    /* (4) 신뢰도 판정 */
    const usedDocs = used.map(u => u.k);
    const notInUsed = cts.filter(t => !coveredByDocs(usedDocs, t));
    let confidence = (top.score >= 30 && used.length === 1 && coverage === 1 && notInUsed.length === 0) ? 'official' : 'partial';
    if (uncoveredAll.length) {
      text += '\n\n※ 질문에 포함된 \'' + uncoveredAll.join('\', \'') + '\' 부분은 등록된 HR 공식 자료에서 확인되지 않았습니다. 해당 부분은 HR 담당자 확인이 필요합니다.';
      confidence = 'partial';
    } else if (confidence === 'partial') {
      text += '\n\n※ 위 내용은 등록된 공식 기준을 그대로 안내한 것으로, 개인별 상황(근속·출근율·휴직 기간 등)에 따라 적용이 달라질 수 있습니다. 정확한 일수·금액은 인사운영팀 확인을 권장합니다.';
    }
    return {
      ok: true, text,
      sources: used.map(u => ({ ...u.k, __status: u.status })),
      keywords: suggestKeywords(toks, used.map(u => u.k)),
      related: suggestQuestions(query, used.map(u => u.k)),
      confidence, srcIds: used.map(u => u.k.id), missing: uncoveredAll,
      category: top.k.category
    };
  },
  /* 관리자 AI Test 용 — 후보 문서 점수까지 반환 */
  test(query) {
    const hits = retrieve(query);
    return { answer: this.ask(query), hits };
  }
};

function suggestKeywords(toks, docs) {
  const out = [];
  const push = (w) => { if (w && !out.includes(w) && !toks.some(t => t === normalize(w))) out.push(w); };
  docs.forEach(d => (d.keywords || []).slice(0, 5).forEach(push));
  if (out.length < 4) {
    const cats = docs.map(d => d.category);
    Store.kb().filter(d => cats.includes(d.category) && docStatus(d) === 'current')
      .forEach(d => (d.keywords || []).slice(0, 2).forEach(push));
  }
  if (out.length < 4) ['연차','경조휴가','육아휴직','복지포인트','퇴직'].forEach(push);
  return out.slice(0, 6);
}
function suggestQuestions(query, docs) {
  const asked = normalize(query), out = [];
  const push = (q) => { if (q && normalize(q) !== asked && !out.includes(q)) out.push(q); };
  docs.forEach(d => (d.faqs || []).forEach(push));
  const cats = docs.map(d => d.category);
  Store.kb().filter(d => docStatus(d) === 'current' && cats.includes(d.category) && !docs.includes(d))
    .forEach(d => (d.faqs || []).slice(0, 1).forEach(push));
  return out.slice(0, 3);
}

App.send = function (preset) {
  const ta = $('#q');
  const text = (preset != null ? preset : (ta ? ta.value : '')).trim();
  if (!text) return;
  if (ta && preset == null) { ta.value = ''; ta.style.height = 'auto'; }
  if (!App.convoId) { App.convoId = uid('C'); Store.s.conversations.push({ id: App.convoId, userId: App.role.key, startedAt: iso(TODAY) }); }
  App.msgs.push({ id: uid('M'), role: 'user', text });
  App.msgs.push({ id: 'typing', role: 'typing' });
  paintChat();
  setTimeout(() => {
    App.msgs = App.msgs.filter(m => m.role !== 'typing');
    const a = AI.ask(text);
    const qid = uid('Q');
    Store.addQuestion({
      id: qid, text, category: a.ok ? a.category : guessCategory(text), answered: a.ok,
      knowledgeId: a.ok ? a.srcIds[0] : null, status: a.ok ? 'answered' : 'unanswered',
      userId: App.role.key + '-me', createdAt: iso(TODAY), conversationId: App.convoId, confidence: a.confidence
    });
    App.msgs.push({ id: uid('M'), role: 'ai', answer: a, questionId: qid, fb: null, fbOpen: false, fbDone: false });
    paintChat();
  }, 420);
};
App.askKeyword = function (kw) { App.send(kw + ' 관련 기준을 알려주세요'); };
App.vote = function (mid, type) {
  const m = App.msgs.find(x => x.id === mid); if (!m) return;
  m.fb = type;
  if (type === 'up') {
    m.fbOpen = false; m.fbDone = true;
    Store.addFeedback({ id: uid('F'), questionId: m.questionId, questionText: qText(m), type: 'up', reason: null, createdAt: iso(TODAY) });
  } else { m.fbOpen = true; m.fbDone = false; }
  paintChat();
};
App.submitReason = function (mid) {
  const m = App.msgs.find(x => x.id === mid); if (!m) return;
  const sel = document.querySelector(`input[name="fb-${mid}"]:checked`);
  Store.addFeedback({ id: uid('F'), questionId: m.questionId, questionText: qText(m), type: 'down',
    reason: sel ? sel.value : '기타', createdAt: iso(TODAY) });
  m.fbOpen = false; m.fbDone = true;
  paintChat(); toast('의견이 관리자 화면에 등록되었습니다.');
};
App.cancelReason = function (mid) { const m = App.msgs.find(x => x.id === mid); if (m) { m.fbOpen = false; m.fb = null; } paintChat(); };
function qText(m) {
  const i = App.msgs.indexOf(m);
  for (let j = i - 1; j >= 0; j--) if (App.msgs[j].role === 'user') return App.msgs[j].text;
  return '';
}
function guessCategory(text) {
  const hits = retrieve(text);
  return hits.length ? hits[0].k.category : '기타';
}

/* ---- 차트 (외부 라이브러리 없이 SVG 직접 생성) ---- */
function barChart(data, opts) {
  opts = opts || {};
  const w = 620, h = 170, pad = 26, bw = (w - pad * 2) / data.length;
  const max = Math.max(1, ...data.map(d => d.n));
  return `<div class="chartwrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="질문 추이">
    <line class="axis" x1="${pad}" y1="${h - 24}" x2="${w - pad}" y2="${h - 24}"/>
    ${data.map((d, i) => {
      const bh = Math.round((d.n / max) * (h - 58));
      const x = pad + i * bw + bw * .18, y = h - 24 - bh;
      return `<rect x="${x}" y="${y}" width="${bw * .64}" height="${Math.max(bh, 2)}" rx="3" fill="${opts.color || 'var(--blue)'}" opacity="${.45 + .55 * (d.n / max)}"></rect>
        ${d.n ? `<text class="val" x="${x + bw * .32}" y="${y - 4}" text-anchor="middle">${d.n}</text>` : ''}
        ${i % opts.every === 0 ? `<text class="lbl" x="${x + bw * .32}" y="${h - 8}" text-anchor="middle">${d.d.slice(5)}</text>` : ''}`;
    }).join('')}
  </svg></div>`;
}
function catBars(entries) {
  const total = entries.reduce((a, b) => a + b[1], 0) || 1;
  const colors = ['var(--blue)', 'var(--mint)', 'var(--purple)', '#F59E0B', '#EC4899', '#0EA5E9', '#22C55E', '#94A3B8', '#6366F1', '#14B8A6', '#F97316'];
  return entries.map(([c, n], i) => `
    <div style="margin-bottom:11px">
      <div class="spread" style="font-size:13px"><span>${esc(c)}</span>
        <span class="dim">${fmt(n)}건 · ${(n / total * 100).toFixed(1)}%</span></div>
      <div class="bar"><i style="width:${(n / total * 100).toFixed(1)}%;background:${colors[i % colors.length]}"></i></div>
    </div>`).join('');
}

function viewAiTest(c) {
  c.innerHTML = `
  <div class="panel" style="margin-bottom:14px"><h3>AI 답변 테스트</h3><div class="pad">
    <div class="row" style="align-items:flex-start">
      <input class="input" id="tq" style="flex:1;min-width:220px" placeholder="예: 휴직 중에도 성과급을 받을 수 있나요?"
        onkeydown="if(event.key==='Enter')App.runTest()">
      <button class="btn primary" onclick="App.runTest()">테스트</button>
    </div>
    <div class="kw" style="margin-top:10px">
      ${['육아휴직 중에도 연차가 발생하나요?', '경조휴가는 며칠인가요?', '휴직 중에도 성과급을 받을 수 있나요?', '퇴사하면 남은 연차는 어떻게 되나요?']
        .map(q => `<button onclick="App.testQuestion(${JSON.stringify(q).replace(/"/g, '&quot;')})">${esc(q)}</button>`).join('')}
    </div>
  </div></div>
  <div id="tres"></div>`;
}
App.runTest = function () {
  const q = ($('#tq').value || '').trim(); if (!q) return;
  const r = AI.test(q), a = r.answer;
  const badge = a.confidence === 'official' ? ['🟢 공식 기준 기반', 'mint'] : a.confidence === 'partial' ? ['🟡 일부 근거 · 확인 권장', 'amber'] : ['🔴 근거 없음 · HR 이관', 'red'];
  $('#tres').innerHTML = `
  <div class="grid2">
    <div class="panel"><h3>AI 답변<span class="r"><span class="tag ${badge[1]}">${badge[0]}</span></span></h3>
      <div class="pad"><div class="testbox" style="white-space:pre-wrap">${esc(a.text)}</div>
      ${a.keywords.length ? `<div style="margin-top:12px"><div class="sect-label">관련 키워드</div><div class="kw">${a.keywords.map(k => `<button onclick="App.testQuestion(${JSON.stringify(k + ' 기준 알려줘').replace(/"/g, '&quot;')})">${esc(k)}</button>`).join('')}</div></div>` : ''}
      </div></div>
    <div class="panel"><h3>참조 Knowledge<span class="r">검색 점수순</span></h3><div class="pad">
      ${r.hits.length ? r.hits.slice(0, 5).map(h => {
        const used = a.srcIds && a.srcIds.includes(h.k.id);
        return `<div class="spread" style="padding:9px 0;border-bottom:1px solid var(--line)">
          <span style="min-width:0"><b>${used ? '✓' : '·'} ${esc(h.k.title)}</b>
            <div class="small dim">${esc(h.k.version)} · ${esc(h.k.id)} · ${STATUS_LABEL[h.status][0]}</div></span>
          <span class="small" style="font-weight:700;color:${used ? 'var(--blue)' : 'var(--text-3)'}">${h.score.toFixed(1)}</span></div>`;
      }).join('') : `<div class="empty"><b>매칭된 문서가 없습니다</b>Knowledge 추가가 필요합니다.</div>`}
      ${!a.ok ? `<button class="btn sm primary" style="margin-top:12px" onclick="App.newFromQuestion(${JSON.stringify(q).replace(/"/g, '&quot;')},'기타')">이 질문으로 Knowledge 추가</button>` : ''}
    </div></div>
  </div>`;
};

/* ---- Settings ---- */
function viewSettings(c) {
  const isSuper = App.role.key === 'SUPER_ADMIN';
  c.innerHTML = `
  <div class="panel" style="margin-bottom:14px"><h3>Role 정의</h3><div class="pad">
    ${Object.values(ROLES).map(r => `
      <div class="roleline">
        <span class="ic" style="width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:${r.color};color:${r.tint};flex:none">${r.ic}</span>
        <div style="flex:1;min-width:0"><b>${esc(r.key)}</b> <span class="small dim">${esc(r.label)}</span>
          <div class="perm">${r.perms.join(' · ')}</div></div>
        ${App.role.key === r.key ? '<span class="tag blue">현재 계정</span>' :
          (isSuper ? `<button class="btn sm" onclick="App.switchRole('${r.key}')">이 계정으로 전환</button>` : '')}
      </div>`).join('')}
    <p class="small dim" style="margin-top:12px">TODO: 실제 Notion / SSO(SAML·OIDC) 계정 연동 후 Role 매핑. 현재는 데모용 로컬 Role입니다.</p>
  </div></div>
  <div class="panel"><h3>데이터</h3><div class="pad">
    <div class="spread" style="padding:7px 0"><span>Knowledge 문서</span><b>${fmt(Store.kb().length)}건</b></div>
    <div class="spread" style="padding:7px 0;border-top:1px solid var(--line)"><span>질문 로그</span><b>${fmt(Store.s.questions.length)}건</b></div>
    <div class="spread" style="padding:7px 0;border-top:1px solid var(--line)"><span>Feedback</span><b>${fmt(Store.s.feedback.length)}건</b></div>
    <div class="spread" style="padding:7px 0;border-top:1px solid var(--line)"><span>HR 문의</span><b>${fmt(Store.s.inquiries.length)}건</b></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" onclick="App.exportData()">Knowledge JSON 내보내기</button>
      ${isSuper ? `<button class="btn danger" onclick="App.resetAll()">데모 데이터 초기화</button>` : ''}
    </div>
    <p class="small dim" style="margin-top:10px">저장소: 브라우저 localStorage. TODO: 실제 DB(PostgreSQL 등) + HRIS 연동으로 교체</p>
  </div></div>`;
}
App.exportData = function () {
  const blob = new Blob([JSON.stringify(Store.kb().map(k => { const c = { ...k }; delete c.__idx; return c; }), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'simmons-knowledge-base.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Knowledge JSON을 내려받았습니다.');
};
App.resetAll = function () {
  if (!confirm('데모 데이터를 초기 상태로 되돌릴까요? 추가한 Knowledge와 로그가 모두 삭제됩니다.')) return;
  Store.reset(); render(); toast('초기화했습니다.');
};

/* =========================================================================
 * 10. 라우터
 * ========================================================================= */
function render() {
  const h = location.hash || '#/';
  if (!App.role) { renderLogin(); return; }
  if (h.startsWith('#/admin')) {
    if (App.role.key === 'USER') { location.hash = '#/portal'; renderPortal(); toast('관리자 권한이 필요합니다.'); return; }
    renderAdmin(h);
  } else { renderPortal(); }
}
window.addEventListener('hashchange', render);
Store.init();
if (Store.s.role && ROLES[Store.s.role]) App.role = ROLES[Store.s.role];
render();

</script>
</body>
</html>
